<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1b1d21; color: #e8eaed; font: 12px "Segoe UI", sans-serif; }
  .row { display: flex; gap: 18px; padding: 20px; }
  .tile { width: 72px; text-align: center; }
  .icon { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #24272c; border: 1px solid #33373d; border-radius: 10px; }
  .icon img { max-width: 40px; max-height: 40px; }
  .name { margin-top: 6px; color: #9aa0a6; }
</style>
</head>
<body>
<div class="row">
  <div class="tile"><div class="icon"><img src="drupal.svg"></div><div class="name">Drupal</div></div>
  <div class="tile"><div class="icon"><img src="wordpress.svg"></div><div class="name">WordPress</div></div>
  <div class="tile"><div class="icon"><img src="typo3.svg"></div><div class="name">TYPO3</div></div>
  <div class="tile"><div class="icon"><img src="joomla.svg"></div><div class="name">Joomla</div></div>
  <div class="tile"><div class="icon"><img src="processwire.svg"></div><div class="name">ProcessWire</div></div>
  <div class="tile"><div class="icon"><img src="concretecms.png"></div><div class="name">Concrete</div></div>
  <div class="tile"><div class="icon"><img src="grav.svg"></div><div class="name">Grav</div></div>
  <div class="tile"><div class="icon"><img src="wintercms.png"></div><div class="name">Winter</div></div>
  <div class="tile"><div class="icon"><img src="twill.png"></div><div class="name">Twill</div></div>
</div>
</body>
</html>
